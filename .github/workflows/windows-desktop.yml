name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [claude/creative-asset-generator-nzsenv]
    paths: ['.github/workflows/windows-desktop.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run package:win

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path "release/Texture Forge-win32-x64" -DestinationPath "release/TextureForge-win-x64.zip"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-v0.1.0-$($env:GITHUB_SHA.Substring(0,7))"
          gh release create $tag "release/TextureForge-win-x64.zip" `
            --target $env:GITHUB_SHA `
            --title "Texture Forge (Windows portable)" `
            --notes "Portable Windows build. Unzip and run **Texture Forge.exe** — no install needed. Exports save to your Downloads folder."
